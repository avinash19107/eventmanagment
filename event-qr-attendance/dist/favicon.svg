<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>

    <!-- Ticket Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Main Rounded App Icon Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

  <!-- Holographic Ticket Pass Body -->
  <rect x="12" y="14" width="40" height="36" rx="8" fill="#FFFFFF" filter="url(#glow)"/>

  <!-- Ticket Header Strip (Indigo Accent) -->
  <path d="M 12 22 C 12 17.58 15.58 14 20 14 L 44 14 C 48.42 14 52 17.58 52 22 L 52 25 L 12 25 Z" fill="#4338CA"/>

  <!-- Star Badge on Header -->
  <circle cx="20" cy="19.5" r="2.5" fill="url(#goldGrad)"/>
  <rect x="26" y="18" width="16" height="3" rx="1.5" fill="rgba(255,255,255,0.8)"/>

  <!-- QR Code Grid Motif inside Ticket Body -->
  <!-- Top Left QR Finder Pattern -->
  <rect x="17" y="30" width="10" height="10" rx="2" fill="#1E1B4B"/>
  <rect x="19" y="32" width="6" height="6" rx="1" fill="#FFFFFF"/>
  <rect x="21" y="34" width="2" height="2" fill="#4F46E5"/>

  <!-- Top Right QR Data Dots -->
  <rect x="31" y="30" width="3" height="3" rx="0.5" fill="#4F46E5"/>
  <rect x="36" y="30" width="3" height="3" rx="0.5" fill="#1E1B4B"/>
  <rect x="41" y="30" width="4" height="4" rx="1" fill="url(#goldGrad)"/>

  <!-- Middle QR Data Dots -->
  <rect x="31" y="35" width="4" height="4" rx="1" fill="#1E1B4B"/>
  <rect x="37" y="35" width="3" height="3" rx="0.5" fill="#4F46E5"/>

  <!-- Bottom Left QR Data Dots -->
  <rect x="17" y="42" width="4" height="4" rx="1" fill="url(#goldGrad)"/>
  <rect x="23" y="42" width="4" height="4" rx="1" fill="#4F46E5"/>

  <!-- Bottom Right QR Finder Pattern -->
  <rect x="35" y="40" width="10" height="10" rx="2" fill="#1E1B4B"/>
  <rect x="37" y="42" width="6" height="6" rx="1" fill="#FFFFFF"/>
  <rect x="39" y="44" width="2" height="2" fill="#F59E0B"/>

  <!-- Ticket Side Notches -->
  <circle cx="12" cy="32" r="3" fill="#4F46E5"/>
  <circle cx="52" cy="32" r="3" fill="#4F46E5"/>
</svg>